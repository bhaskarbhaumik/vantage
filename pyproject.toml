[project]
name = "vantage"
version = "0.1.0"
description = "Vantage — Verified Account Navigator: Targeting, Analysis & GTM Engine. Multi-agent, multi-backend research engine."
readme = "README.md"
requires-python = ">=3.12,<4"
license = { text = "MIT" }
authors = [{ name = "Vantage contributors" }]
keywords = ["vantage", "multi-agent", "research", "account-intelligence", "llm"]

# Core runtime — everything the DEFAULT (workflow) and the `api` backend need to run.
# Heavier framework backends and cloud SDKs are optional extras below, because installing
# LangGraph + ADK + CrewAI together frequently produces transitive-version conflicts.
dependencies = [
  "anthropic>=0.121",
  "openai>=2.54",
  "google-genai>=2.17",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
  "aiofiles>=24.1",
  "orjson>=3.10",
  "tavily-python>=0.5",
  "edgartools>=3.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
# ── Framework backends (install the one you want to run) ──
agent-sdk = ["claude-agent-sdk>=0.1"]
langgraph = [
  "langgraph>=0.2",
  "langchain-anthropic>=0.2",
  "langchain-openai>=0.2",
  "langchain-google-genai>=2.0",
]
adk    = ["google-adk>=0.3"]
crewai = ["crewai>=0.70"]

# ── Cloud SDKs (install the target you deploy to) ──
cloud-gcp   = ["google-cloud-storage>=2.16", "google-cloud-run>=0.10", "google-auth>=2.30"]
cloud-azure = ["azure-identity>=1.17", "azure-storage-blob>=12.20"]
cloud-aws   = ["boto3>=1.34"]

# ── Dev ──
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "types-aiofiles",
       # validates config/default.json against its own schema in the test suite
       "jsonschema>=4.22"]

# Convenience: every cloud SDK at once (frameworks are intentionally NOT bundled here —
# choose one to avoid resolver conflicts).
cloud = [
  "google-cloud-storage>=2.16", "google-cloud-run>=0.10", "google-auth>=2.30",
  "azure-identity>=1.17", "azure-storage-blob>=12.20",
  "boto3>=1.34",
]

[project.scripts]
vantage-engine = "vantage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]

[tool.hatch.build.targets.wheel.force-include]
"harness" = "vantage/_harness"
"config" = "vantage/_config"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
