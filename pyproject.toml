[project]
name = "vantage"
dynamic = ["version"]
description = "Vantage — Verified Account Navigator: Targeting, Analysis & GTM Engine. Multi-agent, multi-backend research engine."
readme = "README.md"
requires-python = ">=3.12,<4"
license = { text = "MIT" }
authors = [{ name = "Vantage contributors" }]
keywords = ["vantage", "multi-agent", "research", "account-intelligence", "llm"]

# Core runtime — everything the DEFAULT (workflow) and the `api` backend need to run.
# Heavier framework backends and cloud SDKs are optional extras below, because installing
# LangGraph + ADK + CrewAI together frequently produces transitive-version conflicts.
dependencies = [
  "anthropic>=0.121",
  "openai>=2.54",
  "google-genai>=2.34.0",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "httpx>=0.27",
  "tenacity>=8.3",
  "python-dotenv>=1.2.4",
  "typer>=0.27.3",
  "rich>=13.7",
  "platformdirs>=4.14.2",
  "aiofiles>=24.1",
  "orjson>=3.13.0",
  "tavily-python>=0.8.5",
  "edgartools>=5.62.1",
  "yfinance>=1.7.0",
]

[project.optional-dependencies]
# ── Framework backends (install the one you want to run) ──
agent-sdk = ["claude-agent-sdk>=0.2.176"]
langgraph = [
  "langgraph>=1.2.19",
  "langchain-anthropic>=1.7.7",
  "langchain-openai>=1.7.3",
  "langchain-google-genai>=4.4.2",
]
adk    = ["google-adk>=2.13.0"]
crewai = ["crewai>=0.70"]

# ── Cloud SDKs (install the target you deploy to) ──
cloud-gcp   = ["google-cloud-storage>=3.17.1", "google-cloud-run>=0.16.2", "google-auth>=2.62.0"]
cloud-azure = ["azure-identity>=1.27.0", "azure-storage-blob>=12.31.1"]
cloud-aws   = ["boto3>=1.43.123"]

# ── Export: dossier -> PPTX / DOCX / PDF / self-contained HTML (`vantage export`) ──
export = [
  "python-pptx>=1.0.2",
  "python-docx>=1.2",
  "matplotlib>=3.9",
  "numpy>=2.5.4",
  "pypdf>=6.21.4",
  "pillow>=11.0",
  "plotly>=6.0",
]

# ── Dev ──
dev = ["vantage[export]", "pytest>=9.2.0", "pytest-asyncio>=1.4.1", "ruff>=0.17.3", "mypy>=2.4.1", "types-aiofiles",
       # validates config/default.json against its own schema in the test suite
       "jsonschema>=4.22"]

# Convenience: every cloud SDK at once (frameworks are intentionally NOT bundled here —
# choose one to avoid resolver conflicts).
cloud = [
  "google-cloud-storage>=3.17.1", "google-cloud-run>=0.16.2", "google-auth>=2.62.0",
  "azure-identity>=1.27.0", "azure-storage-blob>=12.31.1",
  "boto3>=1.43.123",
]

[project.scripts]
vantage = "vantage.cli:main"
vantage-engine = "vantage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vantage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]

[tool.hatch.build.targets.wheel.force-include]
"harness" = "vantage/_harness"
"config" = "vantage/_config"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
