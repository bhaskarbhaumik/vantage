name: Feature request
description: Suggest a new capability or an improvement.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Commands, flags or config keys are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Engine, CLI, TUI, Export, Harness / dossier content, Claude Code plugin, Docs, Other]
    validations:
      required: true
  - type: checkboxes
    id: billing
    attributes:
      label: Authentication
      options:
        - label: This proposal keeps subscription-first authentication; any API billing stays opt-in.
          required: true
